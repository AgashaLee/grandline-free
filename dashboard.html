<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Piece Card Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Special+Elite&family=Rye&display=swap" rel="stylesheet">
<script>try{document.documentElement.setAttribute("data-theme",localStorage.getItem("opct_theme")||"light")}catch(e){}</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --sea:#1799d6; --sea-deep:#0d6ea3;
    --red:#e23b3b; --red-deep:#c62828;
    --gold:#f6b93b; --gold-deep:#e58e26;
    --page-bg:linear-gradient(180deg,#bfe9fb 0%,#e7f6fd 20%,#fff6e6 60%);
    --surface:#fffaf0; --surface-head:#f7ead0;
    --row-alt:#fffdf7; --row-hover:#fff4d9;
    --ink:#3a2a1e; --muted:#9c8a76; --line:#ecdcc2;
    --btn-bg:#ffffff; --btn-hover:#fff4d9; --input-bg:#ffffff;
    --head-text:#c62828; --sub-head:#0d6ea3;
    --good:#159a5b; --bad:#e23b3b;
    --shadow:0 6px 18px rgba(20,80,120,.09);
  }
  :root[data-theme="dark"]{
    --page-bg:linear-gradient(180deg,#0b1626 0%,#0e1a2b 40%,#111a26 100%);
    --surface:#182234; --surface-head:#1e2a3f;
    --row-alt:#1b2537; --row-hover:#243350;
    --ink:#ede3d0; --muted:#93a1b5; --line:#2c3a4f;
    --btn-bg:#1e2a3f; --btn-hover:#26344c; --input-bg:#0f1826;
    --head-text:#f6b93b; --sub-head:#5bb8e6;
    --good:#34d399; --bad:#f87171;
    --shadow:0 8px 22px rgba(0,0,0,.4);
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       color:var(--ink);font-size:13px;padding:0 0 48px;min-height:100vh;
       background:var(--page-bg) no-repeat;background-attachment:fixed}
  h1,.big,.card h3,.panel h3,th{font-family:'Fredoka',-apple-system,'Segoe UI',sans-serif}
  .header{background:linear-gradient(180deg,var(--red),var(--red-deep));
          border-bottom:4px solid var(--gold);padding:14px 22px;
          display:flex;align-items:center;justify-content:space-between;
          position:sticky;top:0;z-index:10;box-shadow:0 4px 14px rgba(198,40,40,.25)}
  .header h1{font-size:20px;font-weight:700;color:#fff;letter-spacing:.5px;
             text-shadow:0 2px 0 rgba(0,0,0,.15)}
  .sub{color:#ffe9c7;font-size:11px;margin-top:2px}
  .wrap{max-width:1120px;margin:22px auto;padding:0 18px}
  .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .card{background:var(--surface);border:2px solid var(--line);border-radius:16px;
        padding:16px 20px;flex:1;min-width:200px;box-shadow:var(--shadow)}
  .card h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;
           color:var(--sub-head);margin-bottom:10px;font-weight:600}
  .big{font-size:27px;font-weight:700;color:var(--ink);letter-spacing:.2px}
  .card .note{color:var(--muted);font-size:11px;margin-top:5px}
  table{width:100%;border-collapse:collapse;background:var(--surface);
        border:2px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  th,td{padding:10px 11px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--surface-head);color:var(--head-text);font-size:11px;text-transform:uppercase;
     cursor:pointer;user-select:none;letter-spacing:.03em;font-weight:600}
  th:hover{filter:brightness(.97)}
  td.card-name{text-align:left;font-weight:600;color:var(--ink);
     white-space:normal;overflow-wrap:anywhere;max-width:340px}
  th.left{text-align:left}
  tbody tr:nth-child(even){background:var(--row-alt)}
  tbody tr:hover{background:var(--row-hover)}
  tr:last-child td{border-bottom:none}
  tfoot td{background:var(--surface-head);font-weight:700;border-top:2px solid var(--gold)}
  .good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}
  .pill{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(246,185,59,.16);
        color:var(--gold-deep);margin-left:6px;text-transform:uppercase;letter-spacing:.04em;font-weight:600}
  .pill.par{background:rgba(21,154,91,.16);color:var(--good)}
  .pill.rg{background:rgba(23,153,214,.16);color:var(--sea)}
  .pill.grd{background:rgba(246,185,59,.22);color:var(--gold-deep)}
  .err{background:rgba(226,59,59,.15);color:var(--bad);font-weight:700;padding:2px 8px;
       border-radius:20px;font-size:11px}
  .id{color:var(--muted);font-size:12px}
  .warm{background:var(--surface);border:2px dashed var(--gold);border-radius:16px;
        padding:34px;text-align:center;color:var(--muted);font-size:14px}
  .spin{display:inline-block;width:15px;height:15px;border:3px solid var(--line);
        border-top-color:var(--gold-deep);border-radius:50%;animation:s 1s linear infinite;
        vertical-align:middle;margin-right:8px}
  @keyframes s{to{transform:rotate(360deg)}}
  button{background:var(--btn-bg);color:var(--ink);border:2px solid var(--line);
         border-radius:10px;padding:7px 13px;font-size:12px;cursor:pointer;
         font-family:inherit;font-weight:600}
  button:hover{background:var(--btn-hover);border-color:var(--gold)}
  button.primary{background:var(--sea);border-color:var(--sea-deep);color:#fff;box-shadow:0 3px 0 var(--sea-deep)}
  button.primary:hover{background:var(--sea-deep)}
  button.danger{background:rgba(226,59,59,.12);border-color:rgba(226,59,59,.4);color:var(--bad)}
  button.danger:hover{background:var(--red);border-color:var(--red-deep);color:#fff}
  button.mini{padding:4px 9px;font-size:11px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .table-scroll{overflow-x:auto}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
  .toolbar input{min-width:220px;width:auto}
  .toolbar .cnt{color:var(--muted);font-size:12px}
  .pager{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
  .pager .pageinfo{color:var(--muted);font-size:12px;min-width:96px;text-align:center}
  input[type=text],input[type=number],select{background:var(--input-bg);color:var(--ink);
       border:2px solid var(--line);border-radius:8px;padding:6px 9px;
       font-size:12px;font-family:inherit;width:120px}
  select{width:auto;cursor:pointer}
  input:focus,select:focus{outline:none;border-color:var(--sea)}
  .panel{background:var(--surface);border:2px solid var(--line);border-radius:16px;
         padding:18px 20px;margin-bottom:20px;box-shadow:var(--shadow)}
  .panel h3{font-size:15px;color:var(--head-text);margin-bottom:12px;font-weight:700}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row label{color:var(--muted);font-size:11px;font-weight:600}
  .versions{margin:12px 0;display:flex;flex-direction:column;gap:6px}
  .ver{display:flex;align-items:center;gap:10px;padding:8px 11px;
       border:2px solid var(--line);border-radius:10px;cursor:pointer;background:var(--btn-bg)}
  .ver:hover{background:var(--btn-hover)}
  .ver.sel{border-color:var(--sea);background:rgba(23,153,214,.14)}
  .ver .lab{flex:1;font-weight:600}
  .ver .pr{color:var(--good);font-weight:600}
  .msg{margin-top:10px;font-size:12px}
  .msg.bad{color:var(--bad)}.msg.good{color:var(--good)}
  td.act{text-align:right;white-space:nowrap}
  .hint{color:var(--muted);font-size:11px;margin-top:6px}
  button.close{background:none;border:none;color:var(--muted);font-size:24px;
       line-height:1;padding:0 4px;cursor:pointer;font-weight:400}
  button.close:hover{color:var(--red);background:none;border:none}
  .header button{background:rgba(255,255,255,.92);color:#3a2a1e;border-color:rgba(255,255,255,.55)}
  .header button:hover{background:#fff;border-color:#fff}
  .header button.primary{background:var(--sea);color:#fff;border-color:var(--sea-deep)}
  .header button.primary:hover{background:var(--sea-deep)}
  #curPicker,#themePicker{font-size:12px;background:rgba(255,255,255,.94);color:#3a2a1e;border-color:rgba(255,255,255,.55)}
  /* Clickable card name + image popup */
  .cardlink{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;
            text-underline-offset:2px}
  .cardlink:hover{color:var(--sea-deep)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;
         display:flex;align-items:center;justify-content:center;padding:20px}
  .modal-box{background:var(--surface);border:2px solid var(--line);border-radius:16px;
             padding:16px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow)}
  .modal-box h4{font-size:14px;color:var(--ink);margin-bottom:10px;font-weight:700}
  .modal-box img{max-width:100%;border-radius:10px;display:block;margin:0 auto}
  .modal-box .mnote{color:var(--muted);font-size:12px;margin-top:10px}
  .modal-box .mclose{margin-top:12px}
  /* Let the header wrap instead of overflowing narrow screens */
  .header{flex-wrap:wrap;row-gap:10px}
  .header>div:last-child{flex-wrap:wrap;justify-content:flex-end}
  @media (max-width:640px){
    .header{padding:12px 14px}
    .header h1{font-size:16px}
    .header .sub{font-size:10px}
    /* Controls drop to their own full-width row below the title */
    .header>div:last-child{width:100%;justify-content:flex-start;gap:8px!important}
    .header>div:last-child button,.header>div:last-child select{padding:6px 9px;font-size:12px}
    #gen{display:none}
    .wrap{padding:0 13px;margin-top:16px}
    .big{font-size:22px}
    th,td{padding:8px 8px}
  }
  /* --- Wanted Poster theme: aged parchment, sepia ink, vintage red --- */
  :root[data-theme="wanted"]{
    --sea:#3f6b8f; --sea-deep:#2c4d6b;
    --red:#9e3b2a; --red-deep:#7a2a1c;
    --gold:#b58a3c; --gold-deep:#8a6526;
    --page-bg:radial-gradient(ellipse at 50% 28%, #e8d7b1 0%, #d7c091 55%, #b69869 100%);
    --surface:#ece0c2; --surface-head:#ddc9a2;
    --row-alt:#e6d9b8; --row-hover:#ddcaa1;
    --ink:#3a2414; --muted:#7c6244; --line:#94734a;
    --btn-bg:#f0e6ca; --btn-hover:#e4d3ab; --input-bg:#f4ecd5;
    --head-text:#8f2f1c; --sub-head:#5a3a1e;
    --good:#3f6b34; --bad:#9e3220;
    --shadow:0 4px 0 rgba(148,115,74,.35), 0 10px 22px rgba(80,50,20,.22);
  }
  :root[data-theme="wanted"] body{color:#3a2414}
  [data-theme="wanted"] .card,[data-theme="wanted"] table,[data-theme="wanted"] .panel{border-width:2.5px}
  [data-theme="wanted"] h1,[data-theme="wanted"] .card h3,[data-theme="wanted"] .panel h3,
  [data-theme="wanted"] th,[data-theme="wanted"] .big{
    font-family:'Special Elite','Fredoka',Georgia,serif;letter-spacing:.3px}
  [data-theme="wanted"] .header h1{font-family:'Rye','Special Elite',Georgia,serif;letter-spacing:1px}
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1>👒 One Piece TCG Portfolio</h1>
      <div class="sub" id="sub">loading…</div>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <select id="themePicker" onchange="applyTheme(this.value)" title="Theme">
        <option value="light">☀️ Light</option>
        <option value="dark">🌙 Dark</option>
        <option value="wanted">📜 Wanted Poster</option>
      </select>
      <select id="curPicker" onchange="setCurrency(this.value)" title="Reporting currency"></select>
      <button class="primary" onclick="toggleAdd()">+ Add card</button>
      <button onclick="load(true)">Refresh</button>
      <a id="logoutLink" href="/whop/logout" style="display:none"><button>Log out</button></a>
      <div class="sub" id="gen"></div>
    </div>
  </div>

  <div class="wrap">
    <div class="panel" id="addPanel" style="display:none">
      <h3 style="display:flex;align-items:center;justify-content:space-between">
        <span>Add a card</span>
        <button class="close" onclick="toggleAdd()" title="Close (Esc)">&times;</button>
      </h3>
      <div class="row">
        <input type="text" id="addCode" placeholder="OP15-118" autocomplete="off"
               onkeydown="if(event.key==='Enter')lookup()">
        <label>Version</label>
        <select id="addRegion" onchange="LOOKUP=null;document.getElementById('addBody').innerHTML=''">
          <option value="jp">🇯🇵 Japanese (¥)</option>
          <option value="en">🇺🇸 English ($)</option>
        </select>
        <button class="primary" id="lookupBtn" onclick="lookup()">Look up</button>
        <button onclick="toggleAdd()">Cancel</button>
      </div>
      <div class="hint">The code is printed at the bottom-left of the card.
        Japanese and English printings are different products with different prices.</div>
      <div id="addBody"></div>
      <div class="msg" id="addMsg"></div>
    </div>

    <div id="toolbar" class="toolbar" style="display:none">
      <input type="text" id="search" placeholder="🔎 Search name or code…"
             autocomplete="off" oninput="setQuery(this.value)"
             onkeydown="if(event.key==='Escape')clearSearch()">
      <button id="clearSearch" class="mini" style="display:none" onclick="clearSearch()">✕ Clear search</button>
      <span class="cnt" id="toolCount"></span>
    </div>

    <div id="content" class="warm"><span class="spin"></span>Pricing your collection…</div>
  </div>

  <!-- Card image popup (hidden until a card name is clicked) -->
  <div id="imgModal" class="modal" style="display:none" onclick="if(event.target===this)closeImage()">
    <div class="modal-box">
      <h4 id="imgTitle"></h4>
      <div id="imgBody"></div>
      <div class="mclose"><button onclick="closeImage()">Close</button></div>
    </div>
  </div>

<script>
// Display currency comes from the server, so the page works in any currency.
const curSym = () => (DATA && DATA.currency_symbol) || '';
const curDec = () => (DATA && DATA.currency_decimals !== undefined) ? DATA.currency_decimals : 0;
const nfmt = n => n.toLocaleString('en-US', {minimumFractionDigits: curDec(), maximumFractionDigits: curDec()});
const fmtIDR = n => n === null || n === undefined ? '–' : curSym() + nfmt(n);
// Sign always leads, so gains and losses line up: +$137.92 / -Rp 38,101
const fmtPL  = n => n === null || n === undefined ? '–'
                  : (n >= 0 ? '+' : '-') + curSym() + nfmt(Math.abs(n));
// Native price: yen has no minor unit, dollars do.
const fmtNative = (n, cur) => {
  if (n === null || n === undefined) return '–';
  if (cur === 'JPY') return '¥' + Math.round(n).toLocaleString('en-US');
  if (cur === 'USD') return '$' + n.toFixed(2);
  return (cur || '') + ' ' + n.toLocaleString('en-US');
};
const fmtPct = n => n === null || n === undefined ? '–' : (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
const cls    = n => n === null || n === undefined ? '' : (n >= 0 ? 'good' : 'bad');
const esc    = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Turn the internal FX source words into something a customer understands.
// "identity" (same currency, no conversion) is dropped entirely.
function fxLabel(src){
  const parts = String(src || '').split(',').map(x => x.trim()).filter(x => x && x !== 'identity');
  if(!parts.length) return '';
  if(parts.includes('stale')) return 'using an older rate (offline)';
  if(parts.includes('live'))  return 'rates just updated';
  if(parts.includes('cache')) return 'rates updated today';
  return '';
}
const gradeLabel = g => g === 'raw' ? 'Raw (ungraded)' : g.replace('-', ' ').toUpperCase();
const gradeSelect = (id, selected) => `<select id="${id}">` +
  (DATA?.grades || ['raw']).map(g =>
    `<option value="${g}"${g === selected ? ' selected' : ''}>${gradeLabel(g)}</option>`).join('') +
  '</select>';

let DATA = null, sortKey = 'pl', sortDir = -1;
let LOOKUP = null, PICKED = null, EDITING = null, SELLING = null;
let PAGE = 1, QUERY = '';
const PAGE_SIZE = 20;

function setQuery(v) { QUERY = v; PAGE = 1; render(); }
function gotoPage(p) { PAGE = p; render(); }
function clearSearch() {
  const s = document.getElementById('search');
  if (s) s.value = '';
  QUERY = ''; PAGE = 1; render();
  if (s) s.focus();
}

function pager(page, pages) {
  if (pages <= 1) return '';
  const btn = (label, p, disabled, title) =>
    `<button class="mini" ${disabled ? 'disabled' : ''} onclick="gotoPage(${p})"${title ? ` title="${title}"` : ''}>${label}</button>`;
  return `<div class="pager">
      ${btn('« First', 1, page <= 1, 'First page')}
      ${btn('‹ Prev', page - 1, page <= 1)}
      <span class="pageinfo">Page ${page} of ${pages}</span>
      ${btn('Next ›', page + 1, page >= pages)}
      ${btn('Last »', pages, page >= pages, 'Last page')}
    </div>`;
}

async function post(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({ok: false, error: 'Bad response from tracker.'}));
  if (res.status === 401 || data.login) { window.location = '/whop/login'; throw new Error('Please log in.'); }
  if (!data.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

/* ---------- card image popup ---------- */
async function showImage(idx){
  const r = (DATA && DATA.rows || []).find(x => x.index === idx);
  if(!r) return;
  document.getElementById('imgTitle').textContent = r.name;
  document.getElementById('imgBody').innerHTML = '<div class="mnote"><span class="spin"></span>Loading image…</div>';
  document.getElementById('imgModal').style.display = 'flex';
  try{
    const res = await post('/api/image', {card_id: r.card_id, region: r.region, variant: r.variant_key});
    document.getElementById('imgBody').innerHTML = res.image
      ? `<img src="${res.image}" alt="${esc(r.name)}" loading="lazy"
             onerror="this.parentNode.innerHTML='<div class=&quot;mnote&quot;>Image could not be loaded.</div>'">`
      : '<div class="mnote">No image available for this card.</div>';
  }catch(e){
    document.getElementById('imgBody').innerHTML = '<div class="mnote">Could not load the image.</div>';
  }
}
function closeImage(){ document.getElementById('imgModal').style.display = 'none'; }

/* ---------- theme ---------- */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('opct_theme', t); }catch(e){}
  const sel = document.getElementById('themePicker');
  if(sel) sel.value = t;
}

/* ---------- currency ---------- */
async function setCurrency(code) {
  try {
    await post('/api/settings', {display_currency: code});
    await load(true);            // every figure is now in a different currency
  } catch (e) { alert(e.message); }
}

function renderCurrencyPicker() {
  const sel = document.getElementById('curPicker');
  if (!sel || !DATA || !DATA.currencies) return;
  // Multi-user (hosted) mode: also show the Log out link. The currency picker
  // stays visible -- each member picks their own currency (saved per-user).
  if (DATA.multi_user) {
    const out = document.getElementById('logoutLink');
    if (out) { out.style.display = ''; out.title = DATA.username ? ('Logged in as ' + DATA.username) : ''; }
  }
  // Only rebuild when the option set changes, so it doesn't fight the user.
  if (sel.dataset.built !== String(DATA.currencies.length)) {
    sel.innerHTML = DATA.currencies.map(c => `<option value="${c}">${c}</option>`).join('');
    sel.dataset.built = String(DATA.currencies.length);
  }
  sel.value = DATA.display_currency;
}

/* ---------- add ---------- */
function toggleAdd() {
  const p = document.getElementById('addPanel');
  const open = p.style.display === 'none';
  p.style.display = open ? '' : 'none';
  if (open) { document.getElementById('addCode').focus(); }
  else { LOOKUP = PICKED = null; document.getElementById('addBody').innerHTML = ''; setMsg('addMsg', ''); }
}

function setMsg(id, text, kind) {
  const el = document.getElementById(id);
  el.textContent = text || '';
  el.className = 'msg' + (kind ? ' ' + kind : '');
}

async function lookup() {
  const code = document.getElementById('addCode').value.trim().toUpperCase();
  if (!code) return;
  const btn = document.getElementById('lookupBtn');
  btn.disabled = true; setMsg('addMsg', 'Looking up…');
  try {
    LOOKUP = await post('/api/lookup', {card_id: code, region: document.getElementById('addRegion').value});
    PICKED = LOOKUP.printings[0].variant;
    renderAddBody();
    setMsg('addMsg', '');
  } catch (e) {
    LOOKUP = null;
    document.getElementById('addBody').innerHTML = '';
    setMsg('addMsg', e.message, 'bad');
  } finally { btn.disabled = false; }
}

function pick(v) { PICKED = v; renderAddBody(); }

function renderAddBody() {
  if (!LOOKUP) return;
  const many = LOOKUP.printings.length > 1;
  const vers = LOOKUP.printings.map(p => `
    <div class="ver ${p.variant === PICKED ? 'sel' : ''}" onclick="pick('${p.variant}')">
      <span class="lab">${esc(p.label)}</span>
      <span class="pr">${p.price === null ? 'no price'
        : fmtNative(p.price, LOOKUP.currency) + ' = ' + fmtIDR(Math.round(p.price * LOOKUP.rate))}</span>
    </div>`).join('');

  document.getElementById('addBody').innerHTML = `
    <div class="versions">
      ${many ? `<div class="hint">${esc(LOOKUP.card_id)} has ${LOOKUP.printings.length} versions — pick the one you own:</div>` : ''}
      ${vers}
    </div>
    <div class="row">
      <label>Paid per card (${(DATA&&DATA.display_currency)||''})</label>
      <input type="text" id="addBuy" placeholder="220000" onkeydown="if(event.key==='Enter')saveAdd()">
      <label>Quantity</label>
      <input type="number" id="addQty" value="1" min="1" style="width:80px">
      <label>Grade</label>
      ${gradeSelect('addGrade', 'raw')}
      <button class="primary" onclick="saveAdd()">Save card</button>
    </div>
    <div class="hint">Leave Grade as “Raw” unless the card is in a PSA/BGS slab.
      Graded-card pricing is coming soon.</div>`;
  document.getElementById('addBuy').focus();
}

async function saveAdd() {
  try {
    setMsg('addMsg', 'Saving…');
    await post('/api/add', {
      card_id: LOOKUP.card_id,
      region: LOOKUP.region,
      variant: PICKED,
      grade: document.getElementById('addGrade').value,
      buy_price: document.getElementById('addBuy').value,
      quantity: document.getElementById('addQty').value,
    });
    setMsg('addMsg', 'Saved.', 'good');
    document.getElementById('addCode').value = '';
    document.getElementById('addBody').innerHTML = '';
    LOOKUP = PICKED = null;
    await load(true);
  } catch (e) { setMsg('addMsg', e.message, 'bad'); }
}

/* ---------- edit / sell ---------- */
function startEdit(i) { EDITING = i; SELLING = null; render(); }
function startSell(i) { SELLING = i; EDITING = null; render(); }
function cancelRow()  { EDITING = SELLING = null; render(); }

async function saveEdit(index, cardId, variant) {
  try {
    await post('/api/update', {
      index, card_id: cardId, variant,
      buy_price: document.getElementById('editBuy').value,
      quantity: document.getElementById('editQty').value,
      grade: document.getElementById('editGrade').value,
    });
    EDITING = null;
    await load(true);
  } catch (e) { alert(e.message); if (/refresh/i.test(e.message)) load(true); }
}

async function confirmSell(index, cardId, variant) {
  try {
    await post('/api/remove', {
      index, card_id: cardId, variant,
      quantity: document.getElementById('sellQty').value,
    });
    SELLING = null;
    await load(true);
  } catch (e) { alert(e.message); if (/refresh/i.test(e.message)) load(true); }
}

function sortBy(key) {
  if (sortKey === key) { sortDir = -sortDir; } else { sortKey = key; sortDir = -1; }
  PAGE = 1;
  render();
}

function render() {
  const d = DATA;
  if (!d) return;
  renderCurrencyPicker();

  if (d.error) {
    document.getElementById('content').className = 'warm';
    document.getElementById('content').textContent = d.error;
    document.getElementById('sub').textContent = 'nothing to show';
    return;
  }

  const t = d.totals;
  const rows = [...d.rows].sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    if (x === null || x === undefined) return 1;
    if (y === null || y === undefined) return -1;
    return typeof x === 'string' ? sortDir * x.localeCompare(y) : sortDir * (x - y);
  });

  const cards = `
    <div class="cards">
      <div class="card"><h3>Invested</h3><div class="big">${fmtIDR(t.invested)}</div>
        <div class="note">${t.cards} card${t.cards === 1 ? '' : 's'}</div></div>
      <div class="card"><h3>Current value</h3><div class="big">${fmtIDR(t.value)}</div>
        <div class="note">${Object.entries(d.rates || {})
          .filter(([c]) => c !== d.display_currency)   // a currency's rate to itself is 1
          .map(([c, r]) => `${c}/${d.display_currency} ${r < 1 ? r.toPrecision(3) : r.toLocaleString('en-US')}`)
          .join(' · ') || esc(d.display_currency)}${(() => { const l = fxLabel(d.fx_source); return l ? ' · ' + l : ''; })()}</div></div>
      <div class="card"><h3>Profit / Loss</h3>
        <div class="big ${cls(t.pl)}">${fmtPL(t.pl)}</div>
        <div class="note ${cls(t.pl_pct)}">${fmtPct(t.pl_pct)}</div></div>
    </div>`;

  const head = [
    ['name', 'Card', 'left'], ['card_id', 'ID', 'left'], ['qty', 'Qty', ''],
    ['buy', 'Buy', ''], ['market_price', 'Market', ''],
    ['market_value', 'Value', ''], ['pl', 'P/L', ''], ['pl_pct', 'P/L %', ''],
  ].map(([k, label, c]) => `<th class="${c}" onclick="sortBy('${k}')">${label}${sortKey === k ? (sortDir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('') + '<th></th>';

  const q = QUERY.trim().toLowerCase();
  const filtered = q
    ? rows.filter(r => (r.name && r.name.toLowerCase().includes(q)) ||
                       (r.card_id && r.card_id.toLowerCase().includes(q)))
    : rows;
  const pages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  if (PAGE > pages) PAGE = pages;
  if (PAGE < 1) PAGE = 1;
  const start = (PAGE - 1) * PAGE_SIZE;
  const pageRows = filtered.slice(start, start + PAGE_SIZE);

  const body = pageRows.map(r => {
    const variant = r.variant ? `<span class="pill par">${esc(r.variant)}</span>` : '';
    const grade = r.grade ? `<span class="pill grd">${esc(r.grade.toUpperCase())}</span>` : '';
    const region = `<span class="pill rg">${esc((r.region || '').toUpperCase())}</span>`;
    const name = `<td class="card-name"><span class="cardlink" onclick="showImage(${r.index})" title="Show card image">${esc(r.name)}</span>${region}${grade}${variant}</td>
                  <td class="id" style="text-align:left">${esc(r.card_id)}</td>`;
    const ref = `${r.index}, '${esc(r.card_id)}', '${esc(r.variant_key)}'`;

    if (EDITING === r.index) {
      return `<tr>${name}
        <td><input type="number" id="editQty" value="${r.qty}" min="1" style="width:70px"></td>
        <td><input type="text" id="editBuy" value="${r.buy_price}" title="price per card"></td>
        <td colspan="2" style="text-align:left">${gradeSelect('editGrade', r.grade || 'raw')}</td>
        <td colspan="2" class="hint" style="text-align:left">price paid per card · grade</td>
        <td class="act">
          <button class="mini primary" onclick="saveEdit(${ref})">Save</button>
          <button class="mini" onclick="cancelRow()">Cancel</button></td></tr>`;
    }
    if (SELLING === r.index) {
      return `<tr>${name}
        <td><input type="number" id="sellQty" value="${r.qty}" min="1" max="${r.qty}" style="width:70px"></td>
        <td colspan="5" class="hint" style="text-align:left">how many did you sell? (you own ${r.qty})</td>
        <td class="act">
          <button class="mini danger" onclick="confirmSell(${ref})">Remove</button>
          <button class="mini" onclick="cancelRow()">Cancel</button></td></tr>`;
    }

    const actions = `<td class="act">
        <button class="mini" onclick="startEdit(${r.index})">Edit</button>
        <button class="mini danger" onclick="startSell(${r.index})">Sold</button></td>`;

    if (!r.ok) {
      // A graded card can't be auto-priced yet — say so, don't just show "no price".
      const why = r.grade ? 'graded — price coming soon' : 'no price found';
      return `<tr>${name}<td>${r.qty}</td><td>${fmtIDR(r.buy)}</td>
        <td colspan="4" style="text-align:center"><span class="err">${why}</span></td>${actions}</tr>`;
    }
    return `<tr>${name}
      <td>${r.qty}</td>
      <td>${fmtIDR(r.buy)}</td>
      <td>${fmtNative(r.market_price, r.currency)}</td>
      <td>${fmtIDR(r.market_value)}</td>
      <td class="${cls(r.pl)}">${fmtPL(r.pl)}</td>
      <td class="${cls(r.pl_pct)}">${fmtPct(r.pl_pct)}</td>${actions}</tr>`;
  }).join('');

  const foot = `<tfoot><tr><td class="card-name">TOTAL</td><td></td><td>${t.cards}</td>
      <td>${fmtIDR(t.invested)}</td><td></td><td>${fmtIDR(t.value)}</td>
      <td class="${cls(t.pl)}">${fmtPL(t.pl)}</td>
      <td class="${cls(t.pl_pct)}">${fmtPct(t.pl_pct)}</td><td></td></tr></tfoot>`;

  const bodyHtml = body ||
    `<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:26px">No cards match “${esc(QUERY)}”.</td></tr>`;

  document.getElementById('content').className = '';
  document.getElementById('content').innerHTML = cards +
    `<div class="table-scroll"><table><thead><tr>${head}</tr></thead><tbody>${bodyHtml}</tbody>${foot}</table></div>` +
    pager(PAGE, pages) +
    (t.errors ? `<div class="sub" style="margin-top:10px">${t.errors} card(s) could not be priced — excluded from totals.</div>` : '');

  // Search toolbar (lives outside #content so typing keeps focus)
  const tb = document.getElementById('toolbar');
  if (tb) {
    tb.style.display = d.rows.length ? 'flex' : 'none';
    const clr = document.getElementById('clearSearch');
    if (clr) clr.style.display = q ? '' : 'none';
    const from = filtered.length ? start + 1 : 0;
    const to = start + pageRows.length;
    document.getElementById('toolCount').textContent = d.rows.length
      ? `Showing ${from}–${to} of ${filtered.length}` + (q ? ` matching “${QUERY}” · ${rows.length} total` : '')
      : '';
  }

  const regionLabel = {jp: 'Japanese', en: 'English'};
  const langs = [...new Set(d.rows.map(r => regionLabel[r.region] || r.region))].join(' + ');
  document.getElementById('sub').textContent =
    `${d.rows.length} row${d.rows.length === 1 ? '' : 's'}${langs ? ' · ' + langs + ' prices' : ''}`;
  document.getElementById('gen').textContent =
    'updated ' + new Date(d.built_at * 1000).toLocaleTimeString();
}

async function load(force) {
  try {
    const res = await fetch('/api/data' + (force ? '?refresh=1' : ''));
    DATA = await res.json();
    render();
  } catch (e) {
    document.getElementById('content').className = 'warm';
    document.getElementById('content').textContent = 'Could not reach the tracker. Is it still running?';
  }
}

// Esc backs out of whatever is open: the add panel, or an in-progress
// Edit/Sold row. Without this there is no keyboard way out.
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('imgModal').style.display !== 'none') { closeImage(); return; }
  if (EDITING !== null || SELLING !== null) { cancelRow(); return; }
  if (document.getElementById('addPanel').style.display !== 'none') toggleAdd();
});

applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
load(false);
// Don't let the background refresh yank a half-finished edit out from under you.
setInterval(() => {
  const busy = EDITING !== null || SELLING !== null ||
               document.getElementById('addPanel').style.display !== 'none';
  if (!busy) load(false);
}, 60000);
</script>
</body>
</html>
